<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdDub — Doublage Automatique Audio & Vidéo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <h1 tabindex="0">AdDub — Doublage Automatique Audio & Vidéo</h1>
    </header>

    <main class="app-container">
        <!-- 1. Fichiers & Dossiers -->
        <fieldset class="card">
            <legend tabindex="0">1. Fichiers & Dossiers</legend>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="input_path">Fichier vidéo ou dossier d'entrée :</label>
                    <div class="input-with-buttons">
                        <input type="text" id="input_path" name="input_path" placeholder="Sélectionnez une vidéo ou un dossier..." autocomplete="off">
                        <button type="button" id="btn_browse_file" class="btn btn-secondary">Parcourir fichier...</button>
                        <button type="button" id="btn_browse_folder" class="btn btn-secondary">Parcourir dossier...</button>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="output_dir">Dossier de sortie :</label>
                    <div class="input-with-buttons">
                        <input type="text" id="output_dir" name="output_dir" placeholder="Dossier où enregistrer les vidéos doublées..." autocomplete="off">
                        <button type="button" id="btn_browse_output" class="btn btn-secondary">Parcourir...</button>
                    </div>
                </div>

                <div class="checkbox-row full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" id="overwrite" name="overwrite">
                        <span>Écraser les fichiers existants</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="skip_existing" name="skip_existing" checked>
                        <span>Ignorer si déjà présent en sortie</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="recursive" name="recursive">
                        <span>Traiter les sous-dossiers (récursif)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="preserve_tree" name="preserve_tree">
                        <span>Conserver l'arborescence</span>
                    </label>
                </div>
            </div>
        </fieldset>

        <!-- 2. Synthèse Vocale (TTS) & Voix -->
        <fieldset class="card">
            <legend tabindex="0">2. Moteur TTS, Langue et Voix</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="tts_engine">Moteur de synthèse :</label>
                    <select id="tts_engine" name="tts_engine">
                        <option value="onecore">OneCore (Hors-ligne Windows)</option>
                        <option value="edge">Edge-TTS (En ligne)</option>
                        <option value="gtts">Google TTS (En ligne)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="voice_lang">Langue :</label>
                    <select id="voice_lang" name="voice_lang"></select>
                </div>

                <div class="form-group">
                    <label for="voice_region">Région / Dialecte :</label>
                    <select id="voice_region" name="voice_region"></select>
                </div>

                <div class="form-group">
                    <label for="voice_id">Voix de la région :</label>
                    <select id="voice_id" name="voice_id"></select>
                </div>

                <div class="form-group full-width voice-action-row">
                    <button type="button" id="btn_test_voice" class="btn btn-secondary btn-test-voice">Tester la voix</button>
                    <div class="rates-container">
                        <label for="min_rate_tts">Vitesse min :</label>
                        <input type="number" id="min_rate_tts" name="min_rate_tts" step="0.1" min="0.5" max="3.0" value="1.2" style="width: 70px;">
                        <label for="max_rate_tts">Vitesse max :</label>
                        <input type="number" id="max_rate_tts" name="max_rate_tts" step="0.1" min="0.5" max="4.0" value="1.8" style="width: 70px;">
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- 3. Sous-titres & Traduction -->
        <fieldset class="card">
            <legend tabindex="0">3. Sous-titres & Traduction</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="sub_mode">Source des sous-titres :</label>
                    <select id="sub_mode" name="sub_mode">
                        <option value="auto">Auto (MKV intégré ou fichier .srt homonyme)</option>
                        <option value="srt">Fichier .srt uniquement</option>
                        <option value="mkv">Piste sous-titre MKV intégrée</option>
                    </select>
                </div>

                <div class="form-group" id="group_sub_index">
                    <label for="sub_index">Index de piste sous-titre MKV :</label>
                    <input type="number" id="sub_index" name="sub_index" min="0" max="20" value="0">
                </div>

                <div class="checkbox-row full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" id="translate" name="translate">
                        <span class="highlight-text">Activer la traduction automatique des sous-titres</span>
                    </label>
                </div>

                <div class="form-group trans-options" id="group_tr_from">
                    <label for="translate_from">Langue source (De) :</label>
                    <input type="text" id="translate_from" name="translate_from" value="auto" maxlength="10" placeholder="auto">
                </div>

                <div class="form-group trans-options" id="group_tr_to">
                    <label for="translate_to">Langue cible (Vers) :</label>
                    <input type="text" id="translate_to" name="translate_to" value="fr" maxlength="2" placeholder="fr">
                </div>

                <div class="checkbox-row full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" id="reuse_translated_subs" name="reuse_translated_subs" checked>
                        <span>Réutiliser les sous-titres déjà traduits (dans srt/)</span>
                    </label>
                </div>
            </div>
        </fieldset>

        <!-- 4. Mixage Audio & Format de Sortie -->
        <fieldset class="card">
            <legend tabindex="0">4. Mixage Audio & Format de Sortie</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="audio_index">Piste audio source :</label>
                    <select id="audio_index" name="audio_index">
                        <option value="auto">Auto (Première piste audio)</option>
                        <option value="0">Piste 0 (ffprobe)</option>
                        <option value="1">Piste 1 (ffprobe)</option>
                        <option value="2">Piste 2 (ffprobe)</option>
                        <option value="3">Piste 3 (ffprobe)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ducking_db">Atténuation du fond sonore (Ducking dB) :</label>
                    <input type="number" id="ducking_db" name="ducking_db" step="1.0" min="-30" max="0" value="-5.0">
                </div>

                <div class="form-group">
                    <label for="bg_mix">Volume fond sonore (bg_mix) :</label>
                    <input type="number" id="bg_mix" name="bg_mix" step="0.1" min="0.0" max="2.0" value="1.0">
                </div>

                <div class="form-group">
                    <label for="tts_mix">Volume voix doublée (tts_mix) :</label>
                    <input type="number" id="tts_mix" name="tts_mix" step="0.1" min="0.0" max="2.0" value="1.0">
                </div>

                <div class="form-group">
                    <label for="offset_ms">Décalage voix / sous-titres (ms) :</label>
                    <input type="number" id="offset_ms" name="offset_ms" step="50" value="0">
                </div>

                <div class="form-group">
                    <label for="offset_video_ms">Décalage vidéo (offset_video_ms) :</label>
                    <input type="number" id="offset_video_ms" name="offset_video_ms" step="50" value="0">
                </div>

                <div class="form-group">
                    <label for="audio_codec">Codec audio final :</label>
                    <select id="audio_codec" name="audio_codec">
                        <option value="ac3">AC3 (Recommandé MKV)</option>
                        <option value="aac">AAC (MP4)</option>
                        <option value="mp3">MP3</option>
                        <option value="flac">FLAC</option>
                        <option value="pcm_s16le">PCM 16-bit WAV</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="audio_bitrate">Débit audio (kb/s) :</label>
                    <select id="audio_bitrate" name="audio_bitrate">
                        <option value="128">128 kb/s</option>
                        <option value="192">192 kb/s</option>
                        <option value="256" selected>256 kb/s</option>
                        <option value="320">320 kb/s</option>
                        <option value="640">640 kb/s</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="orig_audio_lang">Nom de la piste originale dans la sortie (VO) :</label>
                    <input type="text" id="orig_audio_lang" name="orig_audio_lang" value="Original" maxlength="30">
                </div>
            </div>
        </fieldset>

        <!-- 5. Actions & Progression -->
        <fieldset class="card">
            <legend tabindex="0">5. Actions & Progression</legend>

            <div class="test-limit-row" style="margin-bottom: 12px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="limit_duration" name="limit_duration">
                    <span>Limiter le traitement pour un test rapide aux premières :</span>
                </label>
                <input type="number" id="limit_duration_sec" name="limit_duration_sec" min="10" max="3600" value="60" style="width: 80px;">
                <span class="unit-text">secondes</span>
            </div>

            <button type="button" id="btn_run" class="btn btn-primary btn-large">DÉMARRER LE DOUBLAGE</button>

            <div class="progress-section">
                <div class="progress-header-row">
                    <span id="progress_step_label" class="progress-title" tabindex="0">Progression du traitement :</span>
                    <span id="progress_percent_badge" class="percent-badge" tabindex="0">0 %</span>
                </div>
                <div class="progress-bar-container" id="progress_bar_container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Progression : 0 %">
                    <div id="progress_fill" class="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="status-bar" id="status_text" role="status" aria-live="polite">Prêt.</div>
            </div>
        </fieldset>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
