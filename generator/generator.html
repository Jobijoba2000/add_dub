<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Commande Batch — AddDub</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #162038;
      --border: #64748b;
      --input-border: #64748b;
      --placeholder: #94a3b8;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: #0b1329;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

        .form-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
      display: grid;
      
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffffff;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background-color: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }

    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffffff;
    }

    /* Output Card */
    .output-card {
      background: #030712;
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .btn-copy {
      background: #1e293b;
      color: var(--accent);
      border: 2px solid var(--accent);
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-copy:hover {
      background: var(--accent);
      color: #000000;
    }

    .command-box {
      background: #000000;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.85rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent);
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 70px;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #16a34a;
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      border: 2px solid #ffffff;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Générateur de Commande Batch — AddDub</h1>
      <p>Créez votre commande <code>start_add_dub.bat</code> facilement</p>
    </header>

    <!-- SECTION 1: SOURCE ET DESTINATION -->
    <div class="card">
      <div class="card-title">Source & Destination</div>

      <div class="form-group">
        <label for="input-path">Chemin d'entrée (Fichier ou Dossier)</label>
        <input type="text" id="input-path" value="input" placeholder="Ex: C:\dossier ou C:\dossier\video.mp4 ou input/video.mp4" oninput="onInputPathManual()">
      </div>

      <div class="form-group">
        <label for="output-dir">Dossier de sortie (Optionnel)</label>
        <input type="text" id="output-dir" placeholder="Par défaut: dossier output/" oninput="updateCommand()">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chk-recursive" onchange="updateCommand()">
        <label for="chk-recursive">Récursif (Sous-dossiers) <code>--recursive</code> / <code>-r</code></label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chk-overwrite" onchange="updateCommand()">
        <label for="chk-overwrite">Écraser les fichiers existants <code>--overwrite</code></label>
      </div>
    </div>

    <!-- SECTION 2: MOTEUR TTS & VOIX -->
    <div class="card">
      <div class="card-title">Moteur TTS & Voix</div>

      <div class="form-row-3">
        <div class="form-group">
          <label for="sel-engine">Moteur TTS</label>
          <select id="sel-engine" onchange="onEngineChange()">
            <option value="onecore" selected>OneCore</option>
            <option value="edge">Edge TTS</option>
            <option value="gtts">gTTS</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sel-lang">Langue</label>
          <select id="sel-lang" onchange="onLangChange()"></select>
        </div>

        <div class="form-group">
          <label for="sel-variant">Région</label>
          <select id="sel-variant" onchange="onVariantChange()"></select>
        </div>
      </div>

      <div class="form-group">
        <label for="sel-voice">Voix</label>
        <select id="sel-voice" onchange="updateCommand()"></select>
      </div>
    </div>

    <!-- SECTION 3: AUDIO & MIXAGE -->
    <div class="card">
      <div class="card-title">Piste Audio & Mixage</div>

      <div class="form-group">
        <label for="input-audio-index">Piste Audio (Index)</label>
        <input type="number" id="input-audio-index" placeholder="Auto (ex: 1, 2)" min="1" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="sel-audio-codec">Codec Audio</label>
        <select id="sel-audio-codec" onchange="updateCommand()">
          <option value="ac3" selected>AC3</option>
          <option value="aac">AAC</option>
          <option value="mp3">MP3</option>
          <option value="flac">FLAC</option>
          <option value="opus">Opus</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sel-audio-bitrate">Bitrate Audio</label>
        <select id="sel-audio-bitrate" onchange="updateCommand()">
          <option value="128">128 kbps</option>
          <option value="192">192 kbps</option>
          <option value="256" selected>256 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-ducking">Ducking (Atténuation dB)</label>
        <input type="number" id="input-ducking" value="5.0" step="0.5" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-bg-mix">Volume Fond sonore</label>
        <input type="number" id="input-bg-mix" value="1.0" step="0.1" max="1.0" min="0" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-tts-mix">Volume TTS</label>
        <input type="number" id="input-tts-mix" value="1.0" step="0.1" max="2.0" min="0" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-offset-audio">Offset Audio (ms) <code>--offset-ms</code></label>
        <input type="number" id="input-offset-audio" value="0" step="50" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-offset-video">Offset Vidéo (ms) <code>--offset-video-ms</code></label>
        <input type="number" id="input-offset-video" value="0" step="50" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-min-rate">Vitesse TTS Min <code>--min-rate-tts</code></label>
        <input type="number" id="input-min-rate" value="1.2" step="0.1" min="0.1" max="1.0" oninput="updateCommand()">
      </div>

      <div class="form-group">
        <label for="input-max-rate">Vitesse TTS Max <code>--max-rate-tts</code></label>
        <input type="number" id="input-max-rate" value="1.8" step="0.1" min="1.0" max="4.0" oninput="updateCommand()">
      </div>
    </div>

    <!-- SECTION 4: SOUS-TITRES & TRADUCTION -->
    <div class="card">
      <div class="card-title">Sous-titres & Traduction</div>

      <div class="form-group">
        <label for="sel-sub">Source des sous-titres</label>
        <select id="sel-sub" onchange="updateCommand()">
          <option value="auto" selected>Auto</option>
          <option value="srt">SRT externe</option>
          <option value="mkv:0">MKV (Piste 0)</option>
          <option value="mkv:1">MKV (Piste 1)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chk-translate" onchange="onTranslateToggle()">
        <label for="chk-translate">Activer la traduction <code>--translate</code></label>
      </div>

      <div class="form-group" id="group-trans-to" style="display: none;">
        <label for="sel-trans-to">Langue cible <code>--translate-to</code></label>
        <select id="sel-trans-to" onchange="updateCommand()">
          <option value="fr" selected>Français (fr)</option>
          <option value="en">Anglais (en)</option>
          <option value="es">Espagnol (es)</option>
          <option value="de">Allemand (de)</option>
          <option value="it">Italien (it)</option>
        </select>
      </div>

      <div class="form-group" id="group-trans-from" style="display: none;">
        <label for="sel-trans-from">Langue source (Optionnel) <code>--translate-from</code></label>
        <select id="sel-trans-from" onchange="updateCommand()">
          <option value="" selected>Auto (Détection)</option>
          <option value="en">Anglais (en)</option>
          <option value="fr">Français (fr)</option>
          <option value="ja">Japonais (ja)</option>
        </select>
      </div>
    </div>

    <!-- SECTION 5: COMMANDE GENEREE -->
    <div class="output-card">
      <div class="output-header">
        <div class="output-title">Commande Batch Générée</div>
        <button type="button" class="btn-copy" onclick="copyCommand()">Copier la commande</button>
      </div>
      <div class="command-box" id="command-output"></div>
    </div>
  </div>

  <div class="toast" id="toast">Commande copiée !</div>

    let STRUCTURED_VOICES = { edge: {}, onecore: {}, gtts: {} };

    function getLangBase(tag) {
      if (!tag) return 'inconnu';
      return tag.split('-')[0].toLowerCase();
    }

    function processVoicesData(raw) {
      const res = { edge: {}, onecore: {}, gtts: {} };
      ['edge', 'onecore', 'gtts'].forEach(eng => {
        const list = raw[eng] || [];
        list.forEach(v => {
          const langTag = v.lang || 'inconnu';
          const base = getLangBase(langTag);
          if (!res[eng][base]) res[eng][base] = {};
          if (!res[eng][base][langTag]) res[eng][base][langTag] = [];
          res[eng][base][langTag].push({
            id: v.id,
            name: v.display_name || v.id
          });
        });
      });
      return res;
    }

    STRUCTURED_VOICES = processVoicesData(RAW_VOICES_DATA);

    function onInputPathManual() {
      const val = document.getElementById('input-path').value.trim();
      const isFile = /\.(mp4|mkv|avi|mov|flv|wmv|webm|mp3|wav|srt|ass)$/i.test(val);
      const chkRec = document.getElementById('chk-recursive');
      
      if (isFile) {
        chkRec.checked = false;
      } else if (val.length > 0) {
        chkRec.checked = true;
      }
      updateCommand();
    }

    function getBrowserLocale() {
      const navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      const parts = navLang.split('-');
      return {
        full: navLang,
        base: parts[0] || 'en'
      };
    }

    function onEngineChange() {
      const engine = document.getElementById('sel-engine').value;
      const langSel = document.getElementById('sel-lang');
      langSel.innerHTML = '';

      const locale = getBrowserLocale();
      const bases = Object.keys(STRUCTURED_VOICES[engine] || {}).sort();
      bases.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b.toUpperCase();
        langSel.appendChild(opt);
      });

      if (bases.includes(locale.base)) {
        langSel.value = locale.base;
      } else if (bases.includes('en')) {
        langSel.value = 'en';
      } else if (bases.length > 0) {
        langSel.value = bases[0];
      }

      onLangChange();
    }

    function onLangChange() {
      const engine = document.getElementById('sel-engine').value;
      const base = document.getElementById('sel-lang').value;
      const varSel = document.getElementById('sel-variant');
      varSel.innerHTML = '';

      const locale = getBrowserLocale();
      const variants = Object.keys(STRUCTURED_VOICES[engine]?.[base] || {}).sort();
      variants.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        varSel.appendChild(opt);
      });

      const matchingVariant = variants.find(v => v.toLowerCase() === locale.full);
      if (matchingVariant) {
        varSel.value = matchingVariant;
      } else if (variants.length > 0) {
        varSel.value = variants[0];
      }

      onVariantChange();
    }

    function onVariantChange() {
      const engine = document.getElementById('sel-engine').value;
      const base = document.getElementById('sel-lang').value;
      const variant = document.getElementById('sel-variant').value;
      const voiceSel = document.getElementById('sel-voice');
      voiceSel.innerHTML = '';

      const voices = STRUCTURED_VOICES[engine]?.[base]?.[variant] || [];
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.name;
        voiceSel.appendChild(opt);
      });

      updateCommand();
    }

    function onTranslateToggle() {
      const active = document.getElementById('chk-translate').checked;
      document.getElementById('group-trans-to').style.display = active ? 'flex' : 'none';
      document.getElementById('group-trans-from').style.display = active ? 'flex' : 'none';
      updateCommand();
    }

    function updateCommand() {
      let cmd = 'start_add_dub.bat --batch';

      const inputPath = document.getElementById('input-path').value.trim();
      if (inputPath) {
        cmd += ` --input "${inputPath}"`;
      }

      const outputDir = document.getElementById('output-dir').value.trim();
      if (outputDir) {
        cmd += ` --output-dir "${outputDir}"`;
      }

      if (document.getElementById('chk-recursive').checked) {
        cmd += ' --recursive';
      }

      if (document.getElementById('chk-overwrite').checked) {
        cmd += ' --overwrite';
      }

      const engine = document.getElementById('sel-engine').value;
      cmd += ` --tts-engine ${engine}`;

      const voice = document.getElementById('sel-voice').value;
      if (voice) {
        cmd += ` --voice "${voice}"`;
      }

      const audioIdx = document.getElementById('input-audio-index').value.trim();
      if (audioIdx) {
        cmd += ` --audio-index ${audioIdx}`;
      }

      const sub = document.getElementById('sel-sub').value;
      if (sub && sub !== 'auto') {
        cmd += ` --sub ${sub}`;
      }

      if (document.getElementById('chk-translate').checked) {
        cmd += ' --translate';
        const transTo = document.getElementById('sel-trans-to').value;
        if (transTo) cmd += ` --translate-to ${transTo}`;
        const transFrom = document.getElementById('sel-trans-from').value;
        if (transFrom) cmd += ` --translate-from ${transFrom}`;
      }

      const ducking = document.getElementById('input-ducking').value;
      if (ducking && ducking !== '5.0') {
        cmd += ` --ducking-db ${ducking}`;
      }

      const bgMix = document.getElementById('input-bg-mix').value;
      if (bgMix && bgMix !== '1.0') {
        cmd += ` --bg-mix ${bgMix}`;
      }

      const ttsMix = document.getElementById('input-tts-mix').value;
      if (ttsMix && ttsMix !== '1.0') {
        cmd += ` --tts-mix ${ttsMix}`;
      }

      const offAudio = document.getElementById('input-offset-audio').value;
      if (offAudio && offAudio !== '0') {
        cmd += ` --offset-ms ${offAudio}`;
      }

      const offVideo = document.getElementById('input-offset-video').value;
      if (offVideo && offVideo !== '0') {
        cmd += ` --offset-video-ms ${offVideo}`;
      }

      const minRate = document.getElementById('input-min-rate').value;
      if (minRate && minRate !== '1.2') {
        cmd += ` --min-rate-tts ${minRate}`;
      }

      const maxRate = document.getElementById('input-max-rate').value;
      if (maxRate && maxRate !== '1.8') {
        cmd += ` --max-rate-tts ${maxRate}`;
      }

      const codec = document.getElementById('sel-audio-codec').value;
      if (codec && codec !== 'ac3') {
        cmd += ` --audio-codec ${codec}`;
      }

      const bitrate = document.getElementById('sel-audio-bitrate').value;
      if (bitrate && bitrate !== '256') {
        cmd += ` --audio-bitrate ${bitrate}`;
      }

      document.getElementById('command-output').textContent = cmd;
    }

    function copyCommand() {
      const text = document.getElementById('command-output').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    onEngineChange();
    onInputPathManual();
  </script>
